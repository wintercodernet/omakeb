# Your own Hyprland keybindings. Seeded once by omakeb; never overwritten.
#
# omakeb leaves these chords free for you: SUPER+SHIFT with A C D E G H I J K L
# M O P R S U V W X Y Z, and SUPER+SHIFT+ALT with most letters. Upstream Omarchy
# fills them with web apps and preinstalled software; we ship none, so they are
# yours.
#
# Launch an app:
#   bindd = SUPER SHIFT, M, Music, exec, spotify
#
# Open a web app in its own window:
#   bindd = SUPER SHIFT, Y, YouTube, exec, omakeb-launch-webapp https://youtube.com
#
# Replace an omakeb binding — unbind first, or both will fire:
#   unbind = SUPER, RETURN
#   bindd  = SUPER, RETURN, My terminal, exec, foot
#
# Prefer hjkl to arrow keys for focus:
#   unbind = SUPER, left
#   unbind = SUPER, right
#   unbind = SUPER, up
#   unbind = SUPER, down
#   bindd  = SUPER, H, Focus on left window, movefocus, l
#   bindd  = SUPER, L, Focus on right window, movefocus, r
#   bindd  = SUPER, K, Focus on above window, movefocus, u
#   bindd  = SUPER, J, Focus on below window, movefocus, d
#   # NB: SUPER+J, K and L are bound by omakeb (split, keybindings, group focus).
#   # Unbind those too, or pick a different set.
