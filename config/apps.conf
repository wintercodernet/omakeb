# Which programs the omakeb keybindings open. Seeded once by the installer;
# never overwritten, so anything you put here survives an update.
#
# This file is read at run time, every time a key is pressed — not at login and
# not when Hyprland parses its config. Change a line, press the key, get the new
# program. There is nothing to reload.
#
# Plain shell syntax: KEY=value, one per line. Quote anything containing spaces.
# A value may carry flags of its own ("nvim -u NONE"); it is treated as a
# command line, not a bare program name.
#
# Every key below is optional. Delete a line and the default comes back — the
# defaults live in the omakeb-launch-* scripts, not in this file, so an empty
# file behaves exactly like a missing one.


# --- terminal -----------------------------------------------------------------
# Default: kitty. Used on its own (SUPER+RETURN), to host the editor, and to
# host TUI programs in a floating window. Anything with a `-e` flag works;
# foot's argument order is special-cased.
#
#TERMINAL=kitty


# --- browser ------------------------------------------------------------------
# Default: chromium if installed, else firefox, else firefox-esr, else
# xdg-open. Discovered rather than hardcoded, so it follows what you install.
#
# omakeb installs firefox-esr — Debian's name for Firefox — so the desktop has a
# browser out of the box. Install chromium and it takes precedence with no
# configuration: Chromium gives real standalone windows for
# omakeb-launch-webapp, which Firefox has not supported since --app was
# removed.
#
#BROWSER=chromium


# The flag for a private/incognito window (SUPER+SHIFT+ALT+B). Defaults are
# derived from the browser: --incognito for Chromium and friends,
# --private-window for Firefox and friends. Set it empty to disable the key's
# private mode entirely.
#
#BROWSER_PRIVATE_FLAG=--incognito


# --- editor -------------------------------------------------------------------
# Default: nvim. Opened inside $TERMINAL, so this expects a console editor. For
# a graphical one, bind the key yourself in bindings.conf instead — it will run
# under the terminal otherwise.
#
#EDITOR_CMD=nvim


# --- file manager -------------------------------------------------------------
# Default: thunar, falling back to whichever of nautilus, nemo, pcmanfm or
# dolphin is installed, then xdg-open.
#
#FILE_MANAGER=thunar
