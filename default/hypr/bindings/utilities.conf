# Menus, system controls, capture and toggles.

# --- menus --------------------------------------------------------------------
bindd = SUPER, SPACE, Menu, exec, omakeb-menu
bindd = SUPER ALT, SPACE, Apps menu, exec, omakeb-menu apps
bindd = SUPER, ESCAPE, System menu, exec, omakeb-menu system
bindld = , XF86PowerOff, System menu, exec, omakeb-menu system
bindd = SUPER, K, Keybindings, exec, omakeb-menu-keybindings
bindd = SUPER CTRL, E, Emoji picker, exec, omakeb-menu-emoji
bindd = SUPER CTRL, SPACE, Theme menu, exec, omakeb-menu style.theme
bindd = SUPER SHIFT CTRL, SPACE, Background switcher, exec, omakeb-menu style.background

# --- system -------------------------------------------------------------------
bindd = SUPER CTRL, L, Lock system, exec, omakeb-system-lock

# --- settings panels ----------------------------------------------------------
# Omarchy opens its own Quickshell panels here. We have no shell of our own
# (D1), so these open the real Debian tools instead. The keys are kept the same
# so the muscle memory transfers.
bindd = SUPER CTRL, A, Audio, exec, omakeb-launch-once pavucontrol
bindd = SUPER CTRL, B, Bluetooth, exec, omakeb-launch-once blueman-manager
bindd = SUPER CTRL, W, Network, exec, omakeb-launch-once nm-connection-editor
bindd = SUPER CTRL, D, Display, exec, omakeb-menu setup.display
bindd = SUPER CTRL, P, Power, exec, omakeb-menu system
bindd = SUPER CTRL, T, Activity, exec, omakeb-launch-tui btop

# --- notifications ------------------------------------------------------------
# xkbcommon names this keysym "comma"; "COMMA" does not match.
bindd = SUPER, comma, Dismiss last notification, exec, makoctl dismiss
bindd = SUPER SHIFT, comma, Dismiss all notifications, exec, makoctl dismiss --all
bindd = SUPER ALT, comma, Invoke last notification, exec, makoctl invoke
bindd = SUPER CTRL, comma, Toggle do not disturb, exec, omakeb-toggle-dnd
bindd = SUPER SHIFT ALT, comma, Notification history, exec, makoctl restore

# --- capture ------------------------------------------------------------------
bindd = , PRINT, Screenshot region, exec, omakeb-capture-screenshot region
bindd = SHIFT, PRINT, Screenshot window, exec, omakeb-capture-screenshot window
bindd = CTRL, PRINT, Screenshot screen, exec, omakeb-capture-screenshot screen
bindd = ALT, PRINT, Screen recording, exec, omakeb-capture-screenrecording
bindd = SUPER, PRINT, Color picker, exec, omakeb-capture-color

# --- toggles ------------------------------------------------------------------
bindd = SUPER SHIFT, SPACE, Toggle top bar, exec, omakeb-toggle-bar
bindd = SUPER CTRL, N, Toggle nightlight, exec, omakeb-toggle-nightlight
bindd = SUPER CTRL, I, Toggle locking on idle, exec, omakeb-toggle-idle
bindd = SUPER, BACKSPACE, Toggle window transparency, exec, omakeb-toggle-transparency
bindd = SUPER SHIFT, BACKSPACE, Toggle window gaps, exec, omakeb-toggle-gaps

# --- lid ----------------------------------------------------------------------
bindld = , switch:on:Lid Switch, Lid closed, exec, omakeb-system-lid close
bindld = , switch:off:Lid Switch, Lid opened, exec, omakeb-system-lid open
