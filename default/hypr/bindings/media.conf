# Volume, brightness and media keys.
#
# Flag reference (verified against Hyprland 0.55.2 source, ConfigManager.cpp):
#   l = locked   — still fires while the session is locked
#   e = repeat   — fires repeatedly while held
#   d = descr.   — adds a description argument, read back by `hyprctl binds -j`
# Flags are an unordered character set, so `bindeld` is `e` + `l` + `d`.
# `e` cannot combine with `r`, and `m` cannot combine with `e`, `r` or `l`.

# --- volume -------------------------------------------------------------------
bindeld = , XF86AudioRaiseVolume, Volume up, exec, omakeb-audio-volume up
bindeld = , XF86AudioLowerVolume, Volume down, exec, omakeb-audio-volume down
bindld = , XF86AudioMute, Mute, exec, omakeb-audio-volume mute
bindld = , XF86AudioMicMute, Mute microphone, exec, omakeb-audio-volume mic-mute

bindeld = ALT, XF86AudioRaiseVolume, Volume up precise, exec, omakeb-audio-volume up 1
bindeld = ALT, XF86AudioLowerVolume, Volume down precise, exec, omakeb-audio-volume down 1

# --- brightness ---------------------------------------------------------------
bindeld = , XF86MonBrightnessUp, Brightness up, exec, omakeb-brightness up
bindeld = , XF86MonBrightnessDown, Brightness down, exec, omakeb-brightness down
bindeld = SHIFT, XF86MonBrightnessUp, Brightness maximum, exec, omakeb-brightness max
bindeld = SHIFT, XF86MonBrightnessDown, Brightness minimum, exec, omakeb-brightness min
bindeld = ALT, XF86MonBrightnessUp, Brightness up precise, exec, omakeb-brightness up 1
bindeld = ALT, XF86MonBrightnessDown, Brightness down precise, exec, omakeb-brightness down 1

# --- media transport ----------------------------------------------------------
bindld = , XF86AudioPlay, Play/pause, exec, playerctl play-pause
bindld = , XF86AudioPause, Play/pause, exec, playerctl play-pause
bindld = , XF86AudioNext, Next track, exec, playerctl next
bindld = , XF86AudioPrev, Previous track, exec, playerctl previous
bindld = ALT, XF86AudioPlay, Next track, exec, playerctl next
bindld = ALT SHIFT, XF86AudioPlay, Previous track, exec, playerctl previous
