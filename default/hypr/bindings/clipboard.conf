# Universal clipboard.
#
# SUPER+C/V/X copy, paste and cut everywhere, including terminals — where the
# real chord is CTRL+SHIFT+C or SHIFT+Insert rather than CTRL+C. omakeb-clipboard
# inspects the focused window's class and forwards the correct chord via
# Hyprland's sendshortcut dispatcher, so there is one muscle memory for the
# whole desktop.
#
# Upstream Omarchy solves this in Lua with a down/up split to work around
# synthetic key state sticking (hyprwm/Hyprland#14099). We use sendshortcut,
# which does not exhibit that; if it turns out to on 0.55, the workaround moves
# into omakeb-clipboard rather than into this file.

bindd = SUPER, C, Universal copy, exec, omakeb-clipboard copy
bindd = SUPER, V, Universal paste, exec, omakeb-clipboard paste
bindd = SUPER, X, Universal cut, exec, omakeb-clipboard cut
bindd = SUPER CTRL, V, Clipboard history, exec, omakeb-menu-clipboard
