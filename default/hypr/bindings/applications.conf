# Application launchers.
#
# Bindings point at omakeb-launch-* wrappers rather than at binaries directly.
# Hyprland expands $variables at parse time, so a variable redefined in the
# user's config would not retroactively change a binding parsed earlier. The
# wrapper reads ~/.config/omakeb/apps.conf at run time instead, which makes
# "change my browser" a one-line edit with no reload semantics to reason about.

bindd = SUPER, RETURN, Terminal, exec, omakeb-launch-terminal
bindd = SUPER ALT, RETURN, Terminal with tmux, exec, omakeb-launch-terminal tmux
bindd = SUPER SHIFT, RETURN, Browser, exec, omakeb-launch-browser
bindd = SUPER SHIFT, B, Browser, exec, omakeb-launch-browser
bindd = SUPER SHIFT ALT, B, Browser (private), exec, omakeb-launch-browser --private
bindd = SUPER SHIFT, F, File manager, exec, omakeb-launch-filemanager
bindd = SUPER SHIFT, N, Editor, exec, omakeb-launch-editor

# SUPER+SHIFT+T deliberately left free: btop is already on SUPER+CTRL+T
# (utilities.conf), matching upstream. Two chords for one action was accidental.

# Omarchy binds a further ~15 keys here for preinstalled apps and web apps
# (Spotify, Signal, 1Password, HEY, ChatGPT...). We ship none of those, so the
# keys are deliberately left free for the user's own bindings in
# ~/.config/omakeb/bindings.conf. See docs for the recipe.
