# omakeb — window and layer rules.
#
# SYNTAX WARNING, and the reason every rule below looks unfamiliar:
#
# Hyprland 0.55 replaced the rule parser. The old spellings are gone, not
# deprecated — `windowrulev2` now returns a hard parse error, and the classic
#
#     windowrule = float, class:^(foo)$          <- 0.44 and earlier
#
# no longer parses either. In 0.55 (src/config/legacy/ConfigManager.cpp,
# handleWindowrule) every comma-separated field must be `<key> <value>`, match
# conditions are prefixed `match:`, and boolean effects take an explicit value:
#
#     windowrule = match:class ^(foo)$, float true
#
# Two more consequences worth knowing before editing this file:
#
#   * `size` is no longer "60% 60%". It is a muParser expression pair split on
#     the FIRST whitespace, with monitor_w/monitor_h/window_w/window_h/cursor_x
#     /cursor_y available — so it must be written `monitor_w*0.6 monitor_h*0.6`
#     with no spaces inside either expression, or the split lands in the wrong
#     place and the rule silently does nothing.
#   * layer rules match on `match:namespace`, not on a bare namespace argument.
#
# Effect and property names are from Hyprland 0.55.2:
#   src/desktop/rule/windowRule/WindowRuleEffectContainer.cpp
#   src/desktop/rule/Rule.cpp

# --- omakeb floating TUIs -----------------------------------------------------
# bin/omakeb-launch-tui opens terminal programs with `kitty --class
# omakeb-float`, which is how btop on SUPER+CTRL+T reads as a panel rather than
# as another tile. Without this rule the window still opens — it just tiles, and
# the "panel" illusion is gone. kitty maps --class to the Wayland app_id, which
# is what Hyprland reports as `class`.
windowrule = match:class ^(omakeb-float)$, float true
windowrule = match:class ^(omakeb-float)$, size monitor_w*0.6 monitor_h*0.6
windowrule = match:class ^(omakeb-float)$, center true

# --- omakeb web apps ----------------------------------------------------------
# bin/omakeb-launch-webapp derives a per-site class of omakeb-webapp-<host>.
# These are ordinary application windows, so they tile like everything else;
# the only thing they need is not to keep a browser's window decorations or
# animate in as if they were a dialog. Per-site rules belong in the user's
# config, where the class is known:
#
#   windowrule = match:class ^(omakeb-webapp-youtube-com)$, workspace 4
windowrule = match:class ^(omakeb-webapp-.*)$, tile true

# --- dialogs and pickers ------------------------------------------------------
# GTK and Qt file choosers, print dialogs and authentication prompts announce
# themselves as modal. Floating and centring them is what every desktop does.
windowrule = match:modal true, float true
windowrule = match:modal true, center true

windowrule = match:class ^(xdg-desktop-portal-gtk)$, float true
windowrule = match:class ^(xdg-desktop-portal-gtk)$, center true

windowrule = match:class ^(polkit-mate-authentication-agent-1)$, float true
windowrule = match:class ^(polkit-mate-authentication-agent-1)$, center true

# --- settings panels ----------------------------------------------------------
# SUPER+CTRL+A/B/W open these through omakeb-launch-once. They are small
# single-purpose windows and tile badly.
windowrule = match:class ^(pavucontrol)$, float true
windowrule = match:class ^(pavucontrol)$, size monitor_w*0.4 monitor_h*0.5
windowrule = match:class ^(pavucontrol)$, center true

windowrule = match:class ^(\.?blueman-manager(-wrapped)?)$, float true
windowrule = match:class ^(\.?blueman-manager(-wrapped)?)$, size monitor_w*0.4 monitor_h*0.5
windowrule = match:class ^(\.?blueman-manager(-wrapped)?)$, center true

windowrule = match:class ^(nm-connection-editor)$, float true
windowrule = match:class ^(nm-connection-editor)$, size monitor_w*0.4 monitor_h*0.5
windowrule = match:class ^(nm-connection-editor)$, center true

# --- media and image viewers --------------------------------------------------
windowrule = match:class ^(imv)$, float true
windowrule = match:class ^(imv)$, size monitor_w*0.7 monitor_h*0.7
windowrule = match:class ^(imv)$, center true

windowrule = match:class ^(mpv)$, float true
windowrule = match:class ^(mpv)$, size monitor_w*0.7 monitor_h*0.7
windowrule = match:class ^(mpv)$, center true
# Do not blank the screen during a film. `focus` keeps the inhibit tied to the
# window actually being watched rather than merely running.
windowrule = match:class ^(mpv)$, idle_inhibit focus

# --- capture ------------------------------------------------------------------
# swappy is the screenshot editor omakeb-capture-screenshot hands off to.
windowrule = match:class ^(swappy)$, float true
windowrule = match:class ^(swappy)$, center true

# Never leak a password manager or an authentication prompt into a screen share.
windowrule = match:class ^(polkit-mate-authentication-agent-1)$, no_screen_share true

# --- noise --------------------------------------------------------------------
# Chromium and Electron ask to maximise themselves on first run. Swallowing the
# request keeps a fresh window inside the tiling layout.
windowrule = match:class ^(chromium|Chromium|google-chrome|brave-browser)$, suppress_event maximize

# --- layer rules --------------------------------------------------------------
# The bar, the launcher and notifications are layer-shell surfaces, not windows,
# so they need `layerrule` and match on the namespace the client registers.
layerrule = match:namespace ^(waybar)$, blur true
layerrule = match:namespace ^(waybar)$, ignore_alpha 0.3

layerrule = match:namespace ^(launcher)$, blur true
layerrule = match:namespace ^(launcher)$, ignore_alpha 0.3

layerrule = match:namespace ^(notifications)$, blur true
layerrule = match:namespace ^(notifications)$, ignore_alpha 0.3

# hyprlock draws its own background; blurring it twice just costs frames.
layerrule = match:namespace ^(hyprlock)$, no_anim true
