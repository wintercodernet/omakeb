# omakeb — layout, decoration and animation.
#
# This file is the source of truth for gaps, borders, rounding and opacity, and
# that is load-bearing rather than cosmetic: omakeb-toggle-gaps and
# omakeb-toggle-transparency read the LIVE values out of the compositor with
# `hyprctl getoption` before they zero them, and restore exactly what they
# captured. So whatever is written here is what a user gets back when they
# toggle a full-bleed layout off again — including values they changed
# themselves in ~/.config/omakeb/hyprland.conf.
#
# Colours are rgb()/rgba(), so no literal '#' appears and hyprlang's
# comment-truncation rule cannot bite.
#
# The colours here are the STANDALONE fallback. ~/.config/hypr/colors.conf is
# rendered from the active palette by omakeb-theme-set and sourced immediately
# after this file, so it overrides every colour below and leaves the geometry
# alone. They stay here so this file still parses to a complete look on its own
# — including on an install interrupted before the theme step ran.

general {
    layout = dwindle

    gaps_in = 5
    gaps_out = 10
    border_size = 2

    col.active_border = rgba(7aa2f7ee) rgba(bb9af7ee) 45deg
    col.inactive_border = rgba(2a2a37aa)

    # Drag a border to resize instead of hunting for the exact 1px edge.
    resize_on_border = true
    extend_border_grab_area = 12

    allow_tearing = false

    snap {
        enabled = true
        window_gap = 10
        monitor_gap = 10
    }
}

decoration {
    rounding = 10
    rounding_power = 2.0

    # Opaque by default. SUPER+BACKSPACE (omakeb-toggle-transparency) drops
    # these to 0.92/0.82 and puts them back from what it read here.
    active_opacity = 1.0
    inactive_opacity = 1.0
    fullscreen_opacity = 1.0

    dim_inactive = false
    dim_strength = 0.15

    blur {
        enabled = true
        size = 5
        passes = 2

        # Blur what is behind a translucent surface without also blurring the
        # already-composited result of the surface itself.
        new_optimizations = true
        ignore_opacity = true

        # Cheap film grain over the blur; kills the banding that shows up on
        # large flat areas at 8 bits per channel.
        noise = 0.015
        brightness = 0.9
        vibrancy = 0.15
    }

    shadow {
        enabled = true
        range = 18
        render_power = 3
        color = rgba(00000055)
    }
}

# If Hyprland feels slow — a VM without GPU acceleration, or an old integrated
# chip — blur is almost always the reason. One line in
# ~/.config/omakeb/hyprland.conf turns it off without losing anything else:
#
#   decoration:blur:enabled = false

animations {
    enabled = true

    bezier = omakebEase, 0.16, 1, 0.3, 1
    bezier = omakebSnap, 0.05, 0.9, 0.1, 1.05

    animation = windowsIn, 1, 4, omakebSnap, popin 85%
    animation = windowsOut, 1, 4, omakebEase, popin 85%
    animation = windowsMove, 1, 4, omakebEase
    animation = border, 1, 8, default
    animation = borderangle, 1, 60, linear, loop
    animation = fade, 1, 4, omakebEase
    animation = workspaces, 1, 5, omakebEase, slidefade 15%
    animation = specialWorkspace, 1, 5, omakebEase, slidefadevert 15%
    animation = layers, 1, 3, omakebEase, fade
}

dwindle {
    # A new window splits the focused one, and the split direction is preserved
    # when its sibling closes — so a layout you built by hand survives closing a
    # window in the middle of it.
    preserve_split = true
    default_split_ratio = 1.0

    # Follow the mouse when resizing rather than the geometric centre.
    smart_resizing = true
}

master {
    new_status = master
    mfact = 0.55
}

group {
    col.border_active = rgba(9ece6aee)
    col.border_inactive = rgba(2a2a37aa)

    groupbar {
        enabled = true
        height = 18
        rounding = 6
        gradients = true
        render_titles = true
        font_size = 10
        text_color = rgba(e6e6ecff)
        col.active = rgba(7aa2f7cc)
        col.inactive = rgba(2a2a37cc)
    }
}

misc {
    # No Hyprland logo, no default wallpaper. hyprpaper owns the background, and
    # a compositor that advertises itself on a machine you configured yourself
    # is noise.
    disable_hyprland_logo = true
    disable_splash_rendering = true
    force_default_wallpaper = 0

    # Shown wherever nothing else has been drawn yet, including the moment
    # between the compositor starting and hyprpaper painting.
    background_color = rgb(0b0b0f)

    font_family = JetBrains Mono

    # A terminal that spawns a graphical program hides itself until that program
    # exits, so `nautilus .` from a shell does not leave a dead terminal behind.
    enable_swallow = true
    swallow_regex = ^(kitty|foot|footclient)$

    # Tell us when an application stops answering, instead of leaving a window
    # that looks alive and is not.
    enable_anr_dialog = true

    focus_on_activate = false

    # vrr is left at the Hyprland default (0, off). Turning it on globally makes
    # some panels flicker at low frame rates; set `misc:vrr = 2` in your own
    # config if you want it for fullscreen only.
}

cursor {
    # Hide the pointer while typing; it reappears on the next mouse movement.
    hide_on_key_press = true
    inactive_timeout = 6
}

xwayland {
    # Let XWayland render at 1x and be scaled up rather than looking tiny on a
    # HiDPI output. Costs sharpness on X11 apps; nothing else has an answer.
    force_zero_scaling = true
}

# --- monitors -----------------------------------------------------------------
# Everything at its preferred mode, laid out left to right, scale auto-detected.
# Per-output rules go in ~/.config/omakeb/hyprland.conf:
#
#   monitor = DP-1, 2560x1440@144, 0x0, 1
#   monitor = eDP-1, preferred, auto, 1.5
monitor = , preferred, auto, auto
