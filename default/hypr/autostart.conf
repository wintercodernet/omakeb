# omakeb — what starts with the session.
#
# `exec-once` runs its argument through /bin/sh -c, which is why the conditional
# forms below work.
#
# THE FIVE UNIT-BACKED DAEMONS ARE NOT LISTED HERE INDIVIDUALLY.
#
# waybar, mako, hyprpaper, hypridle and hyprsunset are declared in
# default/session-daemons.tsv and started by `omakeb-session-daemons` below.
# They need a decision this file cannot make, because it depends on how the
# session was launched rather than on what is installed:
#
#   * through uwsm, graphical-session.target is reached and systemd starts all
#     five. An exec-once line here would start a second copy — that was the "two
#     stacked waybars" bug, and mako's systemd copy was dying in a D-Bus name
#     race while nobody noticed.
#   * launched bare — install/80-services.sh's no-uwsm fallback, or Hyprland
#     from a TTY — the target is never reached and systemd starts none of them.
#     A static file that omits them, as this one used to, leaves that session
#     with no bar, no notifications, no wallpaper daemon, no night light and no
#     hypridle, so nothing locks the screen.
#
# One line that asks at run time is correct on both. See the header of
# default/session-daemons.tsv for the whole argument, and bin/omakeb-daemon for
# why nothing here can start a second copy of anything.
#
# What is left in this file is everything whose right answer does NOT depend on
# the init system: daemons Debian ships no unit for, and one-shot commands.
# Every daemon among them goes through `omakeb-daemon`, a no-op when that exact
# command line is already running, so a compositor restart cannot duplicate
# them. Adding a daemon without it is a bug — test/lint-autostart.py enforces
# that.
#
# TOGGLE STATE (contract C3): a toggle is ON when
# $OMAKEB_STATE/toggles/<name> exists, and every name is chosen so that ABSENT
# means the default. That is what makes this file short — a fresh install has no
# state directory at all and still gets the right session. Nothing here creates
# or seeds a toggle; each line only reacts to a file that is already present.
#
# `omakeb-toggle-enabled <name>` exits 0 when the toggle is on, so:
#     ... || program    starts something unless the toggle turned it off
#     ... && command    applies an effect only when the toggle is on

# --- graphics capability ------------------------------------------------------
# Must run before anything tries to open a GL window. On a GPU that cannot
# provide OpenGL 3.3 core (a VM without 3D acceleration), kitty and every other
# GLFW app die instantly with no visible error; this detects that once and
# switches the session to software rendering. See bin/omakeb-gl-fallback.
exec-once = omakeb-gl-fallback

# --- uwsm handshake -----------------------------------------------------------
# uwsm waits for WAYLAND_DISPLAY and HYPRLAND_INSTANCE_SIGNATURE to appear in
# the systemd activation environment before it declares the graphical session
# up; without them it gives up after ten seconds and the session units never
# start. Hyprland exports them itself on a systemd build, so this is belt and
# braces — `uwsm finalize` is idempotent, and the guard keeps it silent when
# Hyprland was started straight from a TTY with no uwsm involved.
#
# It matters more than it looks: omakeb-session-daemons waits on those same
# units, so anything that delays graphical-session.target delays the bar.
exec-once = command -v uwsm >/dev/null 2>&1 && uwsm finalize

# --- displays -----------------------------------------------------------------
# looknfeel.conf's `monitor = , preferred, auto, auto` is the fallback, and
# `preferred` is only the EDID's preferred mode — on an 8K panel that is
# typically 4K. This puts each output on its best mode and scales anything above
# 4K by 2. It skips any output the user wrote their own `monitor =` rule for.
# See bin/omakeb-monitor-apply.
exec-once = omakeb-monitor-apply

# --- session daemons ----------------------------------------------------------
# The five in default/session-daemons.tsv: waybar, mako, hyprpaper, hypridle,
# hyprsunset. Gives any unit systemd is going to start a few seconds to appear,
# starts whatever is still missing, honours the bar-hidden and idle-inhibited
# toggles either way, and then applies the two pieces of state that can only be
# set once their daemon is up — night light and do-not-disturb.
exec-once = omakeb-session-daemons

# A display that drops and restores its link — a TV sleeping or switching input —
# makes Hyprland announce the output more times than it destroys it, and waybar
# grows an extra stacked bar for every unmatched announce. This watches for the
# topology to settle and restarts waybar only when there are more bars than
# outputs. See bin/omakeb-monitor-watch.
exec-once = omakeb-daemon omakeb-monitor-watch

# --- polkit -------------------------------------------------------------------
# Without an authentication agent, anything that needs a privilege prompt fails
# silently — mounting a disk in Thunar, or a GUI package manager. mate-polkit is
# the lightest agent that does not drag in a whole desktop session (D3).
exec-once = omakeb-daemon /usr/libexec/polkit-mate-authentication-agent-1

# --- clipboard history --------------------------------------------------------
# cliphist only knows what a watcher fed it, so both watchers must be running
# from login or SUPER+CTRL+V shows an empty list. Text and images are separate
# --watch invocations; wl-paste cannot do both in one.
exec-once = omakeb-daemon wl-paste --type text --watch cliphist store
exec-once = omakeb-daemon wl-paste --type image --watch cliphist store

# --- toggles that do not survive a compositor restart -------------------------
# Gaps, rounding and opacity are set by looknfeel.conf every time the config is
# parsed, so a session that was left full-bleed or translucent comes back the
# other way unless it is re-applied here. The values match what
# omakeb-toggle-gaps and omakeb-toggle-transparency apply; those scripts read
# the live "on" values out of the compositor before overwriting them, so the
# restore path stays correct even after this file changes.
#
# These stay here rather than moving into omakeb-session-daemons: they talk to
# the compositor, which is up by definition, so they wait for nothing.
exec-once = omakeb-toggle-enabled no-gaps && hyprctl --batch "keyword general:gaps_in 0 ; keyword general:gaps_out 0 ; keyword general:border_size 0 ; keyword decoration:rounding 0"
exec-once = omakeb-toggle-enabled transparency && hyprctl --batch "keyword decoration:active_opacity 0.92 ; keyword decoration:inactive_opacity 0.82"

# --- wallpaper ----------------------------------------------------------------
# hyprpaper is one of the five. With no wallpaper preloaded it paints nothing,
# which is correct: until the theme slice ships backgrounds,
# misc:background_color in looknfeel.conf is what you see.

# --- your own ------------------------------------------------------------------
# Add to ~/.config/omakeb/hyprland.conf, which is sourced after this file:
#
#   exec-once = nm-applet --indicator
#   exec-once = blueman-applet
