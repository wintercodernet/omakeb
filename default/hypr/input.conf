# omakeb — keyboard, pointer and touchpad.
#
# Every option name below was checked against Hyprland 0.55.2's option table
# (src/config/values/ConfigValues.cpp). Two traps live in this file:
#
#   * `input:touchpad:tap-to-click` and `tap-and-drag` use hyphens, not
#     underscores, unlike every other option in the block.
#   * `gestures:workspace_swipe` no longer exists. 0.55 replaced the whole
#     gestures block with the `gesture` keyword; the old boolean is now an
#     unknown-option error and an error overlay on your first login.
#
# Keyboard layout is deliberately NOT set here. install/60-config.sh renders it
# to ~/.config/hypr/keyboard.conf from /etc/default/keyboard — the answer Debian
# already recorded when you chose a keyboard during installation — and the entry
# point sources that immediately after this file.
#
# To override it for Hyprland only, set yours in ~/.config/omakeb/hyprland.conf,
# which is sourced after both:
#
#   input {
#       kb_layout = no
#       kb_variant = nodeadkeys
#       kb_options = caps:escape
#   }
#
# To change it everywhere — console, greeter and compositor:
#
#   sudo dpkg-reconfigure keyboard-configuration

input {
    follow_mouse = 1
    mouse_refocus = false

    # 0 is libinput's untouched acceleration; the range is -1.0 to 1.0.
    sensitivity = 0

    # Long enough not to fire on a held modifier, fast enough for arrow-key
    # navigation to feel like a terminal.
    repeat_delay = 400
    repeat_rate = 40

    numlock_by_default = true

    touchpad {
        natural_scroll = true
        disable_while_typing = true
        tap-to-click = true
        tap-and-drag = true

        # One, two and three fingers as left, right and middle click. Better
        # than the corner-based default on the clickpads every modern laptop
        # has, where "right click" is a physical region you cannot see.
        clickfinger_behavior = true

        # The default is tuned for a mouse wheel and overshoots on a touchpad.
        scroll_factor = 0.6
    }
}

# --- trackpad gestures --------------------------------------------------------
# 0.55 syntax: gesture = <fingers>, <direction>, [mod:MOD], [scale:N], <action>
# Three-finger horizontal swipe moves between workspaces, matching the mouse
# scroll binding in bindings/tiling.conf so both gestures mean the same thing.
gesture = 3, horizontal, workspace

# Four fingers up toggles the scratchpad, which SUPER+S also does.
gesture = 4, up, special, scratchpad

# --- device overrides ---------------------------------------------------------
# Per-device settings go in a `device` block keyed by the name from
# `hyprctl devices`, in your own config rather than here:
#
#   device {
#       name = elan-touchpad
#       natural_scroll = false
#   }
