# omakeb — session environment.
#
# Set with hyprlang's `env` keyword, which is plain setenv() on the compositor
# process: the value is everything after the first comma, so a value may itself
# contain commas.
#
# Deliberately NOT set here: XDG_CURRENT_DESKTOP, XDG_SESSION_TYPE and
# XDG_SESSION_DESKTOP. uwsm sets all three before Hyprland starts (it is what
# `uwsm start -e -D Hyprland` means), and setting them again from inside the
# compositor would race the environment uwsm has already exported to systemd and
# D-Bus — which is exactly how portals end up looking at the wrong desktop name.
#
# Also deliberately not set: GDK_BACKEND and SDL_VIDEODRIVER. Both toolkits pick
# Wayland on their own when WAYLAND_DISPLAY is present, and pinning them breaks
# the X11-only applications that would otherwise have worked through XWayland.
#
# hyprlang truncates a line at an unescaped '#'; nothing below contains one.

# --- cursor -------------------------------------------------------------------
# Size only, no theme name. Naming a cursor theme that is not installed is a
# classic way to end up with an invisible pointer in some toolkits, and omakeb
# does not install one — the Hyprland built-in is fine until the theme slice
# starts shipping cursors.
env = XCURSOR_SIZE,24
env = HYPRCURSOR_SIZE,24

# --- qt -----------------------------------------------------------------------
# qt6-wayland is installed, so prefer the Wayland platform plugin and fall back
# to xcb for Qt builds without it. Semicolon-separated: this is Qt's own syntax,
# not a list hyprlang parses.
env = QT_QPA_PLATFORM,wayland;xcb
env = QT_WAYLAND_DISABLE_WINDOWDECORATION,1
env = QT_AUTO_SCREEN_SCALE_FACTOR,1

# --- firefox and electron -----------------------------------------------------
env = MOZ_ENABLE_WAYLAND,1
env = ELECTRON_OZONE_PLATFORM_HINT,auto

# --- java ---------------------------------------------------------------------
# Without this, Java AWT windows are invisible or misplaced under any
# non-reparenting window manager, Hyprland included.
env = _JAVA_AWT_WM_NONREPARENTING,1
